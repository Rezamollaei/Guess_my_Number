<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="guess_my_number.css" />
    <title>Guess My Number</title>
  </head>
  <body>
    <div class="floating-elements" aria-hidden="true">
      <span style="--i: 1">7</span>
      <span style="--i: 2">🎲</span>
      <span style="--i: 3">12</span>
      <span style="--i: 4">✨</span>
      <span style="--i: 5">19</span>
      <span style="--i: 6">🔢</span>
      <span style="--i: 7">3</span>
      <span style="--i: 8">🎯</span>
      <span style="--i: 9">16</span>
      <span style="--i: 10">🧩</span>
      <span style="--i: 11">5</span>
      <span style="--i: 12">⭐</span>
    </div>

    <div class="app">
      <header class="header">
        <div class="header-top">
          <div class="title-group">
            <p class="eyebrow">Guess the number</p>
            <h1>Guess My Number</h1>
            <p class="between">1 — 20 · One number · Start guessing</p>
          </div>
          <div class="header-actions">
            <button
              class="btn ghost theme-toggle"
              aria-pressed="true"
              aria-label="Toggle dark mode"
            >
              <span class="theme-icon">🌙</span>
              <span class="theme-text">Dark</span>
            </button>
            <button class="btn ghost again">Again</button>
          </div>
        </div>

        <div class="number-card">
          <div class="number">?</div>
          <p class="number-label">Secret number</p>
        </div>
      </header>

      <main class="game">
        <section class="panel input-panel">
          <label class="input-label" for="guess-input">Your guess</label>
          <div class="input-wrap">
            <input
              id="guess-input"
              type="number"
              class="guess"
              min="1"
              max="20"
              placeholder="?"
            />
            <button class="btn primary check">Check</button>
          </div>
          <p class="message" role="status" aria-live="polite">Start guessing...</p>
          <div class="history">
            <p class="history-title">Guess history</p>
            <div class="history-bubbles" aria-live="polite"></div>
          </div>
        </section>

        <section class="panel stats-panel">
          <div class="stat-card score-card">
            <p class="stat-label">Score</p>
            <p class="score">20</p>
          </div>
          <div class="stat-card highscore-card">
            <p class="stat-label">High score</p>
            <p class="highscore">0</p>
          </div>
          <div class="stat-card hint-card">
            <p class="stat-label">Hints</p>
            <p class="stat-info">
              Warm coral means too high. Cool blue means too low.
            </p>
          </div>
        </section>
      </main>
    </div>

    <script src="guess_my_number.js"></script>
  </body>
</html>
